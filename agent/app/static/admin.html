<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ProOps · Painel</title>
<style nonce="__NONCE__">
:root{color-scheme:light dark;--bg:#f6f6f4;--card:#fff;--fg:#1a1a1a;--mut:#6b6b6b;--line:#e4e4e0;--acc:#1a1a1a;--on:#fff;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1c1c1c;--fg:#ececec;--mut:#9a9a9a;--line:#2e2e2e;--acc:#ececec;--on:#121212;--bad:#f2b8b5}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:24px 0 8px;color:var(--mut);font-weight:600}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.k{font-size:12px;color:var(--mut)}.v{font-size:24px;font-weight:700}
button,input,select{font:inherit;color:inherit}
button{background:var(--acc);color:var(--on);border:0;border-radius:8px;padding:7px 12px;cursor:pointer}
button.s{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
form.login{max-width:340px;margin:12vh auto;display:grid;gap:10px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px}
.bar{display:flex;gap:8px;margin-bottom:8px}.bar input{max-width:320px}
.pag{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--mut)}
.err{color:var(--bad);min-height:1.4em}.hide{display:none!important}
a{color:inherit}.note{color:var(--mut);font-size:13px;margin-top:20px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);max-width:380px}
dialog::backdrop{background:rgba(0,0,0,.5)}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
</style>
</head>
<body>
<main>
<form id="login" class="login hide">
  <h1>ProOps · Painel</h1>
  <input id="em" type="email" placeholder="E-mail" autocomplete="username" required>
  <input id="pw" type="password" placeholder="Senha" autocomplete="current-password" required>
  <button type="submit">Entrar</button><div class="err" id="lerr"></div>
</form>
<div id="app" class="hide">
  <header><h1>ProOps · Painel</h1><div><span class="k" id="quem"></span> <button class="s" id="sair">Sair</button></div></header>
  <div class="err" id="err"></div>
  <h2>Visão geral</h2><div class="grid" id="ov"></div>
  <h2>Contas</h2>
  <div class="bar"><input id="q" type="search" placeholder="Buscar por e-mail"><button id="buscar">Buscar</button></div>
  <div class="card tw"><table><thead><tr>
    <th>E-mail</th><th>Nome</th><th>Criada em</th><th>Último acesso</th><th>Plano</th><th>Acesso</th><th>Teste até</th><th>Origem</th><th>IA no mês</th><th>WhatsApp no mês</th><th></th>
  </tr></thead><tbody id="rows"></tbody></table></div>
  <div class="pag"><span id="info"></span><button class="s" id="ant">Anterior</button><button class="s" id="prox">Próxima</button></div>
  <p class="note">Receita, MRR e conversão ficam no <a href="https://app.revenuecat.com" target="_blank" rel="noopener noreferrer">painel da RevenueCat</a>. Este painel não mostra dados financeiros dos clientes: só cadastro, assinatura e contagens de uso.</p>
</div>
<dialog id="dlg"><div id="dmsg"></div>
  <select id="dplan" class="hide"><option value="pro">Pro</option><option value="family">Família</option></select>
  <div class="row"><button class="s" id="dno">Cancelar</button><button id="dyes">Confirmar</button></div></dialog>
</main>
<script nonce="__NONCE__" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.3/dist/umd/supabase.js" integrity="sha384-sihuiVHG7vyEIuePVbLI4QpHu1dbhCZe4Zqp0FuqnFeEnyIhF3koyXoBZyfbFsYs" crossorigin="anonymous"></script>
<script nonce="__NONCE__">
const CFG = __CONFIG__;
const $ = (id) => document.getElementById(id);
const sb = supabase.createClient(CFG.url, CFG.anon, {auth: {persistSession: true, autoRefreshToken: true}});
let page = 1, termo = "";
const PLANO = {pro: "Pro", family: "Família", free: "Sem plano"};
const ACESSO = {subscriber: "assinante", never: "nunca assinou", lapsed: "encerrada"};
const ORIGEM = {apple: "Apple", google: "Google", manual: "Cortesia"};
const dt = (s) => (s ? new Date(s).toLocaleDateString("pt-BR") : "—");

async function api(path, opts = {}) {
  const {data} = await sb.auth.getSession();
  if (!data.session) throw new Error("sessão expirada");
  const r = await fetch("/admin/api/" + path, {...opts, cache: "no-store", headers: {
    "Authorization": "Bearer " + data.session.access_token, "Content-Type": "application/json"}});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(r.status === 403 ? "Esta conta não tem acesso ao painel." : (j.message || j.detail || "erro " + r.status));
  return j;
}
const erro = (e) => { $("err").textContent = e.message || String(e); };

function card(k, v) {
  const d = document.createElement("div"); d.className = "card";
  const a = document.createElement("div"); a.className = "k"; a.textContent = k;
  const b = document.createElement("div"); b.className = "v"; b.textContent = v;
  d.append(a, b); return d;
}
async function visao() {
  const o = await api("overview");
  const n = (x) => x.toLocaleString("pt-BR");
  $("ov").replaceChildren(
    card("Contas", n(o.contas)), card("Novas em 7 dias", n(o.novas_7d)), card("Novas em 30 dias", n(o.novas_30d)),
    card("Pro", n(o.pro)), card("Família", n(o.familia)), card("Em teste", n(o.em_teste)),
    card("Cortesia", n(o.cortesia)), card("Encerradas", n(o.encerradas)), card("Nunca assinaram", n(o.nunca)),
    card("Turnos de IA no mês", n(o.turnos_ia_mes)), card("Respostas WhatsApp no mês", n(o.respostas_mes)),
    card("Avisos no mês", n(o.avisos_mes)),
    card("Custo de IA no mês (estim.)", "US$ " + o.custo_ia_usd_mes.toLocaleString("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: 2})));
}
function td(t) { const c = document.createElement("td"); c.textContent = t; return c; }
const uso = (a, b) => (a == null ? "—" : a + " / " + (b ?? "—"));
async function lista() {
  const j = await api("accounts?page=" + page + "&q=" + encodeURIComponent(termo));
  const tb = $("rows"); tb.replaceChildren();
  for (const c of j.contas) {
    const tr = document.createElement("tr");
    const acao = document.createElement("td");
    if (c.origem === "manual" && c.plano && c.plano !== "free")
      acao.append(botao("Tirar cortesia", () => confirmar("Tirar a cortesia de " + c.email + "?", false, () => mudar("revoke", {user_id: c.user_id}))));
    else if (!c.origem || c.origem === "manual")
      acao.append(botao("Dar cortesia", () => confirmar("Dar cortesia a " + c.email + ":", true, (p) => mudar("grant", {user_id: c.user_id, plan: p}))));
    tr.append(td(c.email || "—"), td(c.nome || "—"), td(dt(c.criada_em)), td(dt(c.ultimo_acesso)),
      td((PLANO[c.plano] || "—") + (c.teste ? " (teste)" : "")), td(ACESSO[c.acesso] || "—"),
      td(c.teste ? dt(c.ate) : "—"), td(ORIGEM[c.origem] || "—"),
      td(uso(c.turnos_ia, c.limite_ia)), td(uso(c.respostas_whatsapp, c.limite_whatsapp)), acao);
    tb.append(tr);
  }
  const fim = Math.max(1, Math.ceil(j.total / j.por_pagina));
  $("info").textContent = j.total + " contas · página " + page + " de " + fim;
  $("ant").disabled = page <= 1; $("prox").disabled = page >= fim;
}
function botao(t, fn) { const b = document.createElement("button"); b.className = "s"; b.textContent = t; b.addEventListener("click", fn); return b; }
function confirmar(msg, escolhePlano, fn) {
  $("dmsg").textContent = msg; $("dplan").classList.toggle("hide", !escolhePlano);
  $("dno").onclick = () => $("dlg").close();
  $("dyes").onclick = async () => { $("dyes").disabled = true; try { await fn($("dplan").value); } catch (e) { erro(e); } $("dlg").close(); $("dyes").disabled = false; };
  $("dlg").showModal();
}
async function mudar(acao, corpo) {
  await api("courtesy/" + acao, {method: "POST", body: JSON.stringify(corpo)});
  $("err").textContent = ""; await Promise.all([visao(), lista()]);
}
async function entrar() {
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  const {data} = await sb.auth.getSession(); $("quem").textContent = data.session.user.email;
  try { await Promise.all([visao(), lista()]); } catch (e) { erro(e); }
}
$("login").addEventListener("submit", async (ev) => {
  ev.preventDefault(); $("lerr").textContent = "";
  const {error} = await sb.auth.signInWithPassword({email: $("em").value, password: $("pw").value});
  if (error) { $("lerr").textContent = "E-mail ou senha incorretos."; return; }
  $("pw").value = ""; entrar();
});
$("sair").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
$("buscar").addEventListener("click", () => { termo = $("q").value.trim(); page = 1; lista().catch(erro); });
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") $("buscar").click(); });
$("ant").addEventListener("click", () => { page--; lista().catch(erro); });
$("prox").addEventListener("click", () => { page++; lista().catch(erro); });
sb.auth.getSession().then(({data}) => (data.session ? entrar() : $("login").classList.remove("hide")));
</script>
</body>
</html>
