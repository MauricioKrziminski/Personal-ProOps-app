# Dev local. Aponta para o Postgres do Supabase de STAGING (via `.env`, que é o
# staging desde 04/09/2026) — não sobe um Postgres próprio de propósito: testar
# contra um schema diferente do que vai para produção é como a gente descobre
# bug só depois do deploy.
#
# ⚠️ `env_file: .env` não escolhe ambiente nenhum, ele pega o padrão. É por isso
# que o padrão TEM que ser o staging: enquanto `.env` era produção, este
# `docker compose up` — o mesmo que o workflow.md manda rodar antes de commitar —
# ligava o agente local no banco real sem dizer nada. Para apontar em outro
# lugar, `env_file` explícito ou variável na mão, nunca trocando o conteúdo do
# `.env`.
services:
  api:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./app:/srv/app        # reload manual: docker compose restart api
    environment:
      # sem Cloud Tasks no local: o webhook chama o worker direto (ver tasks.py)
      DEBOUNCE_BACKEND: inline
