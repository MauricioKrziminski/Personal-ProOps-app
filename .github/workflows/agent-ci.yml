name: CI

# O portão de `.claude/rules/workflow.md` ("Antes de commitar"), rodando no push para a main e em PR.
# Os filtros de caminho valem para o workflow inteiro; o que roda em cada job está em cada job.
# A avaliação com Gemini REAL não roda aqui, de propósito: ela é por PARTE mexida, local
# (`.claude/rules/workflow.md`, passo 4).

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "src/**"
      - "assets/**"
      - "plugins/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/agent-ci.yml"
  pull_request:
    paths:
      - "agent/**"
      - "src/**"
      - "assets/**"
      - "plugins/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/agent-ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agente:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agent/requirements.txt
            agent/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app --select F,E9
      # Sem rede e sem banco: os nós que falam com o mundo são dublês. `tests/conftest.py` não
      # exige env; a chave é falsa só para os clientes do Gemini poderem ser construídos.
      - run: pytest -q
        env:
          GEMINI_API_KEY: fake

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # a mesma de publish-android-release.yml
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      # `npm test` sai diferente de zero quando algo falha — é o código de saída que vale.
      - run: npm test

  sql:
    runs-on: ubuntu-latest
    # ponytail: NÃO foi provado num runner — escrito a partir de docs/AMBIENTES.md e da memória do
    # projeto, sem rodar o CI. Enquanto ninguém vir este job verde uma vez, ele não derruba o PR.
    # Para torná-lo bloqueante: ver o primeiro run, ajustar o que faltar e tirar a linha abaixo.
    continue-on-error: true
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # `supabase start` aplica as migrations e para na 0008, que exige dois segredos no Vault
      # (`docs/AMBIENTES.md`). Então: sobe a pilha com a pasta de migrations VAZIA, semeia o
      # Vault e só então aplica tudo com `migration up`. Sem studio e sem o que não é banco/auth.
      - name: Sobe o Supabase local sem migrations
        run: |
          mv supabase/migrations /tmp/migrations
          mkdir supabase/migrations
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
          rmdir supabase/migrations
          mv /tmp/migrations supabase/migrations
      - name: Semeia o Vault (exigência da 0008)
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "create extension if not exists supabase_vault with schema vault;" \
            -c "select vault.create_secret('http://127.0.0.1:54321', 'project_url');" \
            -c "select vault.create_secret('local-anon-key', 'anon_key');"
      - name: Aplica as migrations
        run: supabase migration up --local
      # Cada teste é uma transação que volta (`begin; ... rollback;`), mas alguns dependem de data
      # FIXA e envelhecem sozinhos: não é regressão, é o teste. Listados aqui com o motivo
      # (memória do projeto, 05/10/2026); qualquer OUTRA falha derruba o job.
      #   expected_recurring_occurrences, draft_scenario -> datas absolutas no teste
      # Os que exigem banco VAZIO (income_pending, agent_migrations, app_agent_chat) rodam na 1ª fase.
      # Os de `com_dados` pegam "o primeiro espaço com conta" do banco: rodam na 2ª, depois da
      # semente (primeiro run num runner, 06/10/2026: era essa a falha, não o código). Os de
      # `repeatable` conferem o isolamento (`scripts/sql-test.py --repeatable-read` local).
      # Os .py/.mjs de supabase/tests precisam de driver e ficam de fora.
      - name: Roda supabase/tests/*.sql
        run: |
          permitidos="expected_recurring_occurrences draft_scenario"
          com_dados="debt_due_day_semantics debt_overdue_installment debt_projection_metadata debt_register_counted_payments financiamento_maleavel parcela_fixa_com_encargo preview_counted_debt_payments"
          repeatable="finance_write_preview subcategory_financial_preview preview_counted_debt_payments"
          falhas=""
          roda() {
            local nome="$1" opts=""
            if [[ " $repeatable " == *" $nome "* ]]; then opts="-c default_transaction_isolation=repeatable\\ read"; fi
            if PGOPTIONS="$opts" psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "supabase/tests/$nome.sql" >"/tmp/$nome.log" 2>&1 </dev/null; then
              echo "ok    $nome"
            elif [[ " $permitidos " == *" $nome "* ]]; then
              echo "AVISO $nome falhou (data fixa, permitido)"
            else
              echo "FALHA $nome"; tail -n 15 "/tmp/$nome.log"; falhas="$falhas $nome"
            fi
          }
          for f in supabase/tests/*.sql; do
            nome="$(basename "$f" .sql)"
            [[ " $com_dados " == *" $nome "* ]] || roda "$nome"
          done
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q <<'SQL'
          insert into auth.users (id, email) values ('00000000-0000-0000-0000-0000000c1000', 'ci-seed@example.invalid');
          insert into public.profiles (id) values ('00000000-0000-0000-0000-0000000c1000') on conflict do nothing;
          insert into public.workspaces (id, owner_id, name)
            values ('00000000-0000-0000-0000-0000000c1001', '00000000-0000-0000-0000-0000000c1000', 'CI') on conflict do nothing;
          insert into public.workspace_members (workspace_id, user_id, role)
            values ('00000000-0000-0000-0000-0000000c1001', '00000000-0000-0000-0000-0000000c1000', 'owner') on conflict do nothing;
          insert into public.accounts (user_id, workspace_id, name, type, initial_balance_cents)
            select m.user_id, m.workspace_id, 'Conta CI', 'checking', 0
            from public.workspace_members m where m.user_id = '00000000-0000-0000-0000-0000000c1000';
          SQL
          for nome in $com_dados; do roda "$nome"; done
          if [[ -n "$falhas" ]]; then echo "falharam:$falhas"; exit 1; fi
