name: Publish Android release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'ci/release-local-build'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DISTRIBUTION_REPOSITORY: almeidagabriel01/Personal-ProOps-app-releases
  EXPECTED_SIGNER_SHA256: B3:1D:4D:8D:59:AC:82:F5:58:BD:5B:22:FE:C8:9A:1C:37:64:91:CF:1B:5F:17:D8:B9:EF:C4:09:8B:6F:BD:DA

jobs:
  publish:
    name: Build, verify and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Test
        run: npm test

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android build and inspection tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'

      - name: Restore Gradle dependencies and build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install native compiler cache
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ccache

      - name: Restore native compiler outputs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/proops-ccache
          key: android-ccache-${{ runner.os }}-${{ runner.arch }}-ndk27.1-cmake3.22-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            android-ccache-${{ runner.os }}-${{ runner.arch }}-ndk27.1-cmake3.22-${{ hashFiles('package-lock.json') }}-
            android-ccache-${{ runner.os }}-${{ runner.arch }}-ndk27.1-cmake3.22-

      - name: Build signed APK on this runner
        env:
          APP_VARIANT: production
          EXPO_NO_DOTENV: '1'
          CCACHE_DIR: ${{ runner.temp }}/proops-ccache
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-local
        run: eas env:exec production 'bash scripts/release/build-local-android.sh'

      - name: Locate local APK
        id: download
        run: |
          echo "apk_path=$RUNNER_TEMP/personal-proops-release/personal-proops.apk" >> "$GITHUB_OUTPUT"
          echo "release_dir=$RUNNER_TEMP/personal-proops-release" >> "$GITHUB_OUTPUT"

      - name: Verify APK identity, version and signature
        id: apk
        env:
          APK_PATH: ${{ steps.download.outputs.apk_path }}
        run: |
          badging_path="$RUNNER_TEMP/apk-badging.txt"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging "$APK_PATH" > "$badging_path"
          IFS=$'\t' read -r application_id version_code version_name < <(
            node scripts/release/parse-aapt2-badging.mjs --input "$badging_path"
          )

          if [ "$application_id" != 'com.proops.personal' ]; then
            echo "Unexpected application id: $application_id" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version_name" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match APK version $version_name" >&2
            exit 1
          fi
          case "$version_code" in
            ''|*[!0-9]*)
              echo "Invalid Android versionCode: $version_code" >&2
              exit 1
              ;;
          esac
          if [ "$version_code" -le 0 ]; then
            echo "Invalid Android versionCode: $version_code" >&2
            exit 1
          fi

          node scripts/release/verify-apk-signature.mjs \
            --apk "$APK_PATH" \
            --expected-sha256 "$EXPECTED_SIGNER_SHA256" \
            --apksigner "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          release_name="personal-proops-$version_name.apk"
          release_path="${{ steps.download.outputs.release_dir }}/$release_name"
          mv "$APK_PATH" "$release_path"
          apk_sha256="$(sha256sum "$release_path" | cut -d ' ' -f 1)"

          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "release_path=$release_path" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"

      - name: Attest compatibility from the verified APK
        env:
          APK_PATH: ${{ steps.apk.outputs.release_path }}
        run: node scripts/release/attest-local-native-compatibility.mjs "$RUNNER_TEMP/native-compatibility.json" "$APK_PATH" "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"

      - name: Retain verified build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: verified-android-${{ github.run_id }}
          path: |
            ${{ steps.apk.outputs.release_path }}
            ${{ runner.temp }}/native-compatibility.json
          retention-days: 7

      - name: Generate and validate update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        id: manifest
        env:
          APK_SHA256: ${{ steps.apk.outputs.apk_sha256 }}
          RELEASE_NAME: ${{ steps.apk.outputs.release_name }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
        run: |
          manifest_path="${{ steps.download.outputs.release_dir }}/update.json"
          apk_url="https://github.com/$DISTRIBUTION_REPOSITORY/releases/download/$GITHUB_REF_NAME/$RELEASE_NAME"
          node scripts/release/create-update-manifest.mjs \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --url "$apk_url" \
            --sha256 "$APK_SHA256" \
            --notes "Atualização $VERSION_NAME do Personal ProOps." \
            --output "$manifest_path"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$manifest_path"
          echo "manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_REPO_TOKEN }}
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
          RELEASE_PATH: ${{ steps.apk.outputs.release_path }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
        run: |
          title="Personal ProOps $VERSION_NAME"
          notes="Atualização $VERSION_NAME do Personal ProOps."

          if gh release view "$GITHUB_REF_NAME" --repo "$DISTRIBUTION_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RELEASE_PATH" --clobber --repo "$DISTRIBUTION_REPOSITORY"
            gh release upload "$GITHUB_REF_NAME" "$MANIFEST_PATH" "$RUNNER_TEMP/native-compatibility.json" --clobber --repo "$DISTRIBUTION_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$DISTRIBUTION_REPOSITORY" \
              --title "$title" \
              --notes "$notes" \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" "$RELEASE_PATH" "$MANIFEST_PATH" "$RUNNER_TEMP/native-compatibility.json" \
              --repo "$DISTRIBUTION_REPOSITORY" \
              --target main \
              --title "$title" \
              --notes "$notes" \
              --latest
          fi
