# Projeto Supabase do Personal ProOps app.
#
# ⚠️ **Não há mais Edge Functions** (09/09/2026). Este arquivo tinha oito blocos
# `[functions.*]` com a política de JWT de cada uma; todas foram apagadas quando o corte
# Strangler terminou e o agente Python passou a receber tudo diretamente:
#
#   whatsapp-webhook  → POST /whatsapp-inbound   (Meta chama direto o Cloud Run)
#   wa-send-otp       → POST /hooks/otp          (Send SMS Hook do Supabase Auth)
#   billing-webhook   → POST /hooks/billing
#   import-statement  → POST /internal/import-statement
#   process-jobs      → o worker do agente
#   send-reminders / finance-scheduler / send-alerts → POST /cron/* (Cloud Scheduler)
#
# O Supabase segue sendo BANCO e FILA. Se um dia alguém precisar de uma function aqui, leia
# antes o `.claude/rules/supabase.md`: o lugar de lógica nova é `agent/`.

project_id = "app-proops"
