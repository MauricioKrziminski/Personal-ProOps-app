# Configuração das Edge Functions do Personal ProOps app.
# O webhook do WhatsApp NÃO recebe JWT (a Meta chama direto) — a segurança dele
# é a verificação HMAC (X-Hub-Signature-256) + verify_token feita no código.
# Todas as outras funções exigem JWT.

project_id = "app-proops"

[functions.whatsapp-webhook]
verify_jwt = false

[functions.process-jobs]
verify_jwt = true

[functions.send-reminders]
verify_jwt = true

# manutencao financeira (materializa recorrentes 90 dias a frente, fecha faturas,
# promove pendentes vencidos). Chamada por pg_cron de hora em hora.
[functions.finance-scheduler]
verify_jwt = true

# alertas proativos (orcamento, fatura, conta vencendo, saldo negativo).
# Chamada por pg_cron uma vez por dia.
[functions.send-alerts]
verify_jwt = true

# importacao de extrato OFX/CSV chamada pelo app (usuario autenticado)
[functions.import-statement]
verify_jwt = true

# Send SMS Auth Hook do Supabase (entrega OTP via WhatsApp). Sem JWT — a
# segurança é a assinatura standardwebhooks (SEND_SMS_HOOK_SECRET).
[functions.wa-send-otp]
verify_jwt = false

# webhook da RevenueCat (concede plano pago). Sem JWT — a seguranca e o segredo
# constante-time no header Authorization (REVENUECAT_WEBHOOK_SECRET).
[functions.billing-webhook]
verify_jwt = false
