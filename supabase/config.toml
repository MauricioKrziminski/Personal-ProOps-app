# Configuração das Edge Functions do Personal ProOps app.
# O webhook do WhatsApp NÃO recebe JWT (a Meta chama direto) — a segurança dele
# é a verificação HMAC (X-Hub-Signature-256) + verify_token feita no código.
# Todas as outras funções exigem JWT.

project_id = "app-proops"

[functions.whatsapp-webhook]
verify_jwt = false

[functions.process-jobs]
verify_jwt = true

[functions.send-reminders]
verify_jwt = true

# manutencao financeira (materializa recorrentes 90 dias a frente, fecha faturas,
# promove pendentes vencidos). Chamada por pg_cron de hora em hora.
[functions.finance-scheduler]
verify_jwt = true

# alertas proativos (orcamento, fatura, conta vencendo, saldo negativo).
# Chamada por pg_cron uma vez por dia.
[functions.send-alerts]
verify_jwt = true

# importacao de extrato OFX/CSV chamada pelo app (usuario autenticado)
[functions.import-statement]
verify_jwt = true

# Send SMS Auth Hook do Supabase (entrega OTP via WhatsApp). Sem JWT — a
# segurança é a assinatura standardwebhooks (SEND_SMS_HOOK_SECRET).
[functions.wa-send-otp]
verify_jwt = false

# webhook da RevenueCat (concede plano pago). Sem JWT — a seguranca e o segredo
# constante-time no header Authorization (REVENUECAT_WEBHOOK_SECRET).
[functions.billing-webhook]
verify_jwt = false

# ---------------------------------------------------------------------------
# Auth local (03/09/2026) — conta por e-mail e senha com confirmação por CÓDIGO.
# Estes templates são os mesmos que precisam estar no dashboard do projeto
# (Authentication → Email Templates): o app confirma cadastro e recuperação com
# `verifyOtp` + `{{ .Token }}`, nunca com o `{{ .ConfirmationURL }}` padrão.
# ---------------------------------------------------------------------------
[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Seu código do Personal ProOps app"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Trocar a senha do Personal ProOps app"
content_path = "./supabase/templates/recovery.html"

# O projeto hospedado entrega este OTP pelo Send SMS Hook/WhatsApp. Localmente não há Meta nem
# custo: estes dois números aceitam códigos fixos e deixam login + phone_change testáveis de ponta
# a ponta. `enable_confirmations` precisa ser true; false mudaria o telefone sem passar pelo código.
[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Seu código do Personal ProOps app é {{ .Code }}"
max_frequency = "1s"

[auth.sms.test_otp]
5511999990002 = "123456"
5511999990003 = "654321"

# A CLI exige um provider habilitado até para os números de test_otp. Os valores abaixo são
# marcadores locais: para esses dois números o GoTrue valida o mapa acima e não chama a Twilio.
[auth.sms.twilio]
enabled = true
account_sid = "local-test"
message_service_sid = "local-test"
auth_token = "local-test"

# Só local: o padrão de 2 e-mails/hora derruba qualquer teste de fluxo com Mailpit.
[auth.rate_limit]
email_sent = 1000
sms_sent = 1000
