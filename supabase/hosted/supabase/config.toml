# Config APENAS para os projetos HOSPEDADOS (07/09/2026).
#
#   R=$(git rev-parse --show-toplevel)
#   SUPABASE_ENV=staging    npx supabase config push --workdir "$R/supabase/hosted" \
#     --project-ref utkqoiigimqzeenxkxdl
#   SUPABASE_ENV=production npx supabase config push --workdir "$R/supabase/hosted" \
#     --project-ref kwriuifcwyvdrxtspjiz
#
# ⚠️ O `--workdir` tem que ser ABSOLUTO. Com caminho relativo o CLI acaba lendo o
# `supabase/config.toml` da RAIZ — ou seja, o arquivo local, que é exatamente o que este
# diretório existe para não empurrar. Medido em 07/09/2026.
#
# ⚠️ O push APLICA na hora. Ele imprime o diff, mas nao pergunta antes.
#
# O `supabase/config.toml` do repositório descreve a STACK LOCAL: ele liga Twilio com
# `account_sid = "local-test"`, cadastra dois telefones de teste com código fixo e afrouxa o
# rate limit para o Mailpit. Empurrar aquele arquivo para um projeto hospedado escreve tudo isso
# no ar — por isso o push para staging/produção sai DESTE diretório, com `--workdir`.
#
# Os valores abaixo foram lidos do diff real do CLI contra o staging; onde não há motivo para
# mudar, eles repetem o que já estava no projeto.

project_id = "hosted"

# Qual projeto recebe o quê. Selecionado por `SUPABASE_ENV` (ver o cabeçalho acima).
[remotes.staging]
project_id = "utkqoiigimqzeenxkxdl"

# Staging NUNCA teve Phone OTP ligado (docs/AGENTE-CUTOVER.md §2): ligar exige o provider E o
# Send SMS Hook apontando para o Cloud Run de staging. O login de teste ali e por senha.
# Ligado sem provider real e PIOR que desligado — falha com `phone_provider_disabled`, que a
# tela traduz para "Nao deu para continuar agora".
[remotes.staging.auth.sms]
enable_signup = false
enable_confirmations = false

# O template padrão do Supabase usa `{{ .ConfirmationURL }}` (um LINK); o app chama `verifyOtp` e
# precisa de `{{ .Token }}` (o código de 6 dígitos). Os dois arquivos ao lado são symlinks para
# `supabase/templates/` — uma fonte só.
[remotes.staging.auth.email.template.confirmation]
subject = "Seu código do Personal ProOps app"
content_path = "./supabase/confirmation.html"

[remotes.staging.auth.email.template.recovery]
subject = "Trocar a senha do Personal ProOps app"
content_path = "./supabase/recovery.html"

[remotes.production]
project_id = "kwriuifcwyvdrxtspjiz"

# Producao entrega o Phone OTP pelo Send SMS Hook: ele chama o `/hooks/otp` do Cloud Run, que
# manda o template Authentication pelo WhatsApp. Sem declarar isto, o push mandaria a secao de
# hooks VAZIA e desligaria o login por telefone.
# O segredo (SEND_SMS_HOOK_SECRET) nao viaja: o CLI trata `auth.hook.*.secrets` como campo
# secreto e preserva o que ja esta no projeto.
# ⚠️ Esta e a URI que produção tem HOJE, lida do diff do CLI em 07/09/2026 — a Edge Function
# em Deno, não o Cloud Run. Declarar errado aqui derruba o login por telefone no próximo push.
# O `/hooks/otp` do Cloud Run é o destino DEPOIS do corte (docs/PROMOVER-PRODUCAO.md); trocar
# esta linha é um passo do runbook, não uma correção de config.
# ⚠️ Em produção o push deixa SEMPRE um diff pendente de uma linha: `[sms.twilio] enabled`.
# A API recusa desligar o provider enquanto o cadastro por telefone está ligado — devolve 200 e
# mantém `true`. É inerte (as credenciais estão vazias e quem entrega o OTP é o hook abaixo), e
# tentar declarar `true` num override aqui quebra a validação do CLI, que exige a tabela
# `auth.sms.twilio` inteira e não a compõe com a da base. Ver esse diff repetir NÃO é erro.

[remotes.production.auth.hook.send_sms]
enabled = true
uri = "https://kwriuifcwyvdrxtspjiz.supabase.co/functions/v1/wa-send-otp"

[auth]
enabled = true
# O app é mobile e todos os fluxos de e-mail são por CÓDIGO (`verifyOtp`), não por link. O
# padrão `http://localhost:3000` era o que fazia o "Confirmar endereço de e-mail" abrir um
# localhost no celular — não existe servidor nenhum ali.
site_url = "appproops://"
additional_redirect_urls = ["appproops://*"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_manual_linking = false
enable_signup = true
enable_anonymous_sign_ins = false
# O zod de `src/app/signup.tsx` exige 8. Menor aqui deixaria o servidor aceitar o que a tela
# recusa — divergência que só aparece quando alguém cria conta por fora do app.
minimum_password_length = 8

[auth.rate_limit]
email_sent = 1000
sms_sent = 30
sign_in_sign_ups = 30
token_verifications = 30
anonymous_users = 30
token_refresh = 150
verify = 30
otp = 30
web3 = 30

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "30s"
otp_length = 6
otp_expiry = 3600

# ⚠️ **Os templates NÃO ficam aqui na base — eles moram no bloco do staging, mais abaixo.**
#
# Medido em 07/09/2026 contra produção:
#
#   400 Email template modification is not available for free tier projects using the default
#       email provider. Please upgrade your plan or configure a custom SMTP provider.
#
# E o PATCH de auth é ATÔMICO: com um bloco de template na requisição, **nada** é aplicado —
# nem `site_url`, nem `otp_length`, nem o resto. Por isso a base não os declara: é o que permite
# corrigir tudo o mais em produção enquanto o SMTP próprio não existe.
#
# Quando houver SMTP próprio, mova os dois blocos de `[remotes.staging.auth.email.template.*]`
# para cá e o push passa a valer nos dois ambientes.

# Phone OTP é entregue pelo Send SMS Hook (WhatsApp), nunca por Twilio. O provider fica
# DESLIGADO de propósito: ligado com credencial vazia ele é só uma forma de o login falhar
# com uma mensagem que não explica nada.
[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Seu código do Personal ProOps app é {{ .Code }}"
max_frequency = "60s"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""

# O CLI manda `[storage.vector] enabled = true` por padrão e o plano free recusa com
#   402 Please upgrade the project to a paid tier to enable vector buckets
# O push é por serviço: o auth já tinha ido, mas o comando terminava em erro e parecia
# ter falhado inteiro. Declarar aqui deixa o push sair limpo.
[storage]
enabled = true

[storage.vector]
enabled = false
